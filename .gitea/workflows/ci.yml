name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEX_VERSION: "0.149.0"

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Test backend
        run: |
          uv sync --frozen --extra dev
          uv run pytest -q

      - name: Test MCP adapter
        run: uv run --directory mcp --frozen --with pytest==8.4.1 pytest -q

      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg "CODEX_VERSION=${CODEX_VERSION}" \
            --tag "codex-image-studio:ci-${GITHUB_RUN_ID}" \
            .

      - name: Smoke test image
        run: |
          container="codex-image-studio-ci-${GITHUB_RUN_ID}"
          image="codex-image-studio:ci-${GITHUB_RUN_ID}"
          docker run --detach --name "$container" "$image"

          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" curl -fsS http://127.0.0.1:8088/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi

      - name: Clean up CI containers and images
        if: always()
        run: |
          docker rm --force "codex-image-studio-ci-${GITHUB_RUN_ID}" 2>/dev/null || true
          docker image rm "codex-image-studio:ci-${GITHUB_RUN_ID}" 2>/dev/null || true
