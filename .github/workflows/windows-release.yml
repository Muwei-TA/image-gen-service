name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: "0.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CODEX_VERSION: "0.149.0"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare Python environment
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen

      - name: Download official Codex CLI
        run: |
          New-Item -ItemType Directory -Force release-context | Out-Null
          $url = "https://github.com/openai/codex/releases/download/rust-v$env:CODEX_VERSION/codex-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $url -OutFile release-context/codex.exe
          if ((Get-Item release-context/codex.exe).Length -lt 1000000) {
            throw "Downloaded Codex binary is unexpectedly small"
          }

      - name: Build standalone application
        run: >-
          uv run --with pyinstaller==6.16.0 pyinstaller
          --noconfirm --clean --onedir --console
          --name ImageGenService
          --paths .
          --add-data "frontend/dist:frontend/dist"
          --add-binary "release-context/codex.exe:."
          --collect-all uvicorn
          packaging/windows_launcher.py

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" packaging/windows-installer.iss

      - name: Smoke test installed application
        run: |
          $installer = (Resolve-Path "release/ImageGenService-${{ steps.version.outputs.version }}-Setup-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "ImageGenServiceSmoke"
          $install = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }
          $env:IMAGE_GEN_PORT = "18088"
          $application = Start-Process (Join-Path $installDir "ImageGenService.exe") -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18088/api/health" -TimeoutSec 2
                if ($health.ok -eq $true) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              throw "Installed application did not become healthy"
            }
          } finally {
            Stop-Process -Id $application.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Create checksums
        run: |
          $installer = "release/ImageGenService-${{ steps.version.outputs.version }}-Setup-x64.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  $(Split-Path $installer -Leaf)`n"
          [System.IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", $line, [System.Text.Encoding]::ASCII)

      - uses: actions/upload-artifact@v7
        with:
          name: ImageGenService-${{ steps.version.outputs.version }}-Windows-x64
          path: |
            release/ImageGenService-${{ steps.version.outputs.version }}-Setup-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload GitHub Release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          Windows x64 installer for Image Gen Service.

          Includes the Vue/FastAPI application, Python runtime, and official Codex CLI rust-v$env:CODEX_VERSION.
          Codex credentials, generated images, uploads, proxy settings, and runtime data are not included.
          This build is unsigned and Windows SmartScreen may show a warning.
          "@
          gh release create $tag "release/ImageGenService-${{ steps.version.outputs.version }}-Setup-x64.exe" "release/SHA256SUMS.txt" --repo "${{ github.repository }}" --title "Image Gen Service $tag" --notes $notes --verify-tag
