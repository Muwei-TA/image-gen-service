services:
  image-gen:
    build:
      context: .
      dockerfile: Dockerfile.release
      args:
        APP_HOME: ${APP_HOME:-/opt/image-gen-service}
        APP_DATA_DIR: ${APP_DATA_DIR:-/data/image-gen-service}
        APP_WORKDIR: ${APP_WORKDIR:-/workspace}
        CODEX_HOME: ${CODEX_HOME:-/data/codex-home}
        CODEX_BIN_PATH: ${CODEX_BIN_PATH:-/usr/local/bin/codex}
        CODEX_RUNTIME_DIR: ${CODEX_RUNTIME_DIR:-/opt/codex-runtime}
        VITE_IMAGE_GEN_DEFAULT_WORKDIR: ${VITE_IMAGE_GEN_DEFAULT_WORKDIR:-/workspace}
    image: ${IMAGE_GEN_IMAGE:-image-gen-service:release}
    container_name: ${IMAGE_GEN_CONTAINER_NAME:-image-gen-service}
    ports:
      - "${IMAGE_GEN_PORT:-8088}:8088"
    environment:
      IMAGE_GEN_HOST: 0.0.0.0
      IMAGE_GEN_PORT: 8088
      IMAGE_GEN_SERVICE_ROOT: ${APP_HOME:-/opt/image-gen-service}
      IMAGE_GEN_DATA_DIR: ${APP_DATA_DIR:-/data/image-gen-service}
      IMAGE_GEN_DEFAULT_WORKDIR: ${APP_WORKDIR:-/workspace}
      IMAGE_GEN_CODEX_BIN: ${CODEX_BIN_PATH:-/usr/local/bin/codex}
      IMAGE_GEN_CODEX_HOME: ${CODEX_HOME:-/data/codex-home}
      IMAGE_GEN_CODEX_USER_HOME: /home/imagegen
      IMAGE_GEN_GENERATED_IMAGES_DIR: ${CODEX_HOME:-/data/codex-home}/generated_images
      IMAGE_GEN_FRONTEND_DIST_DIR: ${APP_HOME:-/opt/image-gen-service}/frontend/dist
      IMAGE_GEN_FILE_ROOTS: ${APP_DATA_DIR:-/data/image-gen-service}:${APP_WORKDIR:-/workspace}:${CODEX_HOME:-/data/codex-home}/generated_images
      IMAGE_GEN_JOB_TIMEOUT_SECONDS: ${IMAGE_GEN_JOB_TIMEOUT_SECONDS:-1800}
      IMAGE_GEN_MAX_CONCURRENCY: ${IMAGE_GEN_MAX_CONCURRENCY:-2}
      IMAGE_GEN_API_TOKEN: ${IMAGE_GEN_API_TOKEN:-}
      IMAGE_GEN_CORS_ORIGIN: ${IMAGE_GEN_CORS_ORIGIN:-*}
    volumes:
      - ${HOST_DATA_DIR:-./runtime/data}:${APP_DATA_DIR:-/data/image-gen-service}
      - ${HOST_WORKDIR:-./runtime/workspace}:${APP_WORKDIR:-/workspace}
      - ${HOST_CODEX_HOME:-./runtime/codex-home}:${CODEX_HOME:-/data/codex-home}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
