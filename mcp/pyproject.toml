[project]
name = "codex-image-studio-mcp"
version = "0.3.0"
description = "Streamable HTTP MCP server for Codex Image Studio"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "mcp==1.28.1",
  "pydantic==2.12.5",
]

[project.scripts]
codex-image-studio-mcp = "image_gen_mcp.server:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_gen_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
