[project]
name = "image-gen-service-mcp"
version = "0.1.0"
description = "MCP wrapper for image-gen-service HTTP API"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.9.0",
  "pydantic>=2.0.0",
]

[project.scripts]
image-gen-service-mcp = "image_gen_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["image_gen_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
